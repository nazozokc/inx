[package]
name = "inx"
version = "1.0.0"
edition = "2021"
description = "A simple package manager for local packages"
license = "MIT"

[[bin]]
name = "inx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
git2 = { version = "0.19", features = ["vendored-openssl"] }
# Build zlib from source and link statically so the binary has no
# runtime dependency on a system libz.so (Nix environments lack it).
libz-sys = { version = "1.1", features = ["static"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"