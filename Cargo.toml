[package]
name = "inx"
version = "2.0.0"
edition = "2021"
description = "A simple package manager for local packages"
license = "MIT"

[[bin]]
name = "inx"
path = "src/main.rs"

[dependencies]
# Core
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
git2 = { version = "0.19", features = ["vendored-openssl"] }
libz-sys = { version = "1.1", features = ["static"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Phase 1: UX
owo-colors = "4"

# Phase 2: Manifest
toml = "0.8"

# Phase 4: Lock & Checksum
walkdir = "2"
sha2 = "0.10"

# GitHub API
reqwest = { version = "0.12", features = ["blocking", "json"] }
urlencoding = "2"

# Phase 5: Performance
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
indicatif = "0.17"
